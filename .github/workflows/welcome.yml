name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet new contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue in the Cloud FinOps Playbook! 
            
            Our team will review it soon. In the meantime, please make sure you've read our [Contributing Guide](CONTRIBUTING.md) and [Code of Conduct](CODE_OF_CONDUCT.md).
            
            If this is a bug report, please include as much detail as possible about your environment and steps to reproduce.
          pr-message: |
            🎉 Thank you for your first contribution to the Cloud FinOps Playbook!
            
            Our maintainers will review your PR shortly. Please make sure you've read our [Contributing Guide](CONTRIBUTING.md) if you haven't already.
            
            We appreciate your help in making this resource better for everyone!
